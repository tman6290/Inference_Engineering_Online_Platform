# Netlify serves the web app; the API runs on Render (render.yaml).
[build]
  command = "corepack pnpm --filter @forward-pass/web build"
  publish = "apps/web/dist"

[build.environment]
  NODE_VERSION = "22"

# The browser only ever talks to this site; /api/* is proxied to Render, so cookies stay first-party.
# If the Render service gets a different URL, change it here.
[[redirects]]
  from = "/api/*"
  to = "https://forward-pass-api.onrender.com/api/:splat"
  status = 200
  force = true

# Client-side routes (/lesson/…, /p/…) all load the app.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
