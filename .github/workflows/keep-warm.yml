name: keep-warm

# Render's free plan puts the API to sleep after 15 minutes without traffic, and waking it takes
# up to a minute. A ping every 10 minutes keeps it awake; one always-on service fits within the
# free plan's 750 hours a month. GitHub may run scheduled jobs late, so the web app also retries.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping the API health check
        run: curl --fail --silent --show-error --max-time 120 --retry 2 https://forward-pass-api.onrender.com/api/health
