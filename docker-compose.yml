services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-forwardpass}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-forwardpass}
      POSTGRES_DB: ${POSTGRES_DB:-forwardpass}
      TZ: Africa/Lagos
    ports:
      # 5433 on the host so a locally installed Postgres on 5432 doesn't clash.
      - '${POSTGRES_PORT:-5433}:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  runner:
    build:
      context: .
      dockerfile: apps/runner/Dockerfile
    restart: unless-stopped
    environment:
      RUNNER_PORT: 4100
      TZ: Africa/Lagos
      RUNNER_TOKEN: ${RUNNER_TOKEN:-}
      RUNNER_API_URL: ${RUNNER_COMPOSE_API_URL:-http://host.docker.internal:4000}
      RUNNER_JOBS_DIR: /runner-jobs
      # Sandbox containers are siblings started through the host's Docker, so their mounts need
      # the host path of ./runner-jobs. Set it in .env when the runner runs here.
      RUNNER_HOST_JOBS_DIR: ${RUNNER_HOST_JOBS_DIR:-}
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    ports:
      - '4100:4100'
    volumes:
      # The runner starts one sandbox container per check (CPU only, no network).
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner-jobs:/runner-jobs

volumes:
  pgdata:
